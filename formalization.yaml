version: v0.4
project:
  name: "Separated distances in the fixed space R^29"
  description: >-
    For every natural N there is n at least N and an n-point set in the single
    fixed Euclidean space R^29 whose distances on different unordered pairs of
    distinct points differ by at least one, with diameter strictly below
    (499/500)n^2. The sizes n form an unbounded set; no claim is made for every
    large n. As a consequence the formalization proves the negation of the
    fixed-dimension proposition for Erdős Problem 670 exactly as stated in
    Formal Conjectures at commit 2f91d251c07fbbaf9435166d47c11e884a08a6cf,
    using d = 29 and epsilon = 1/1000. No optimality, smallest dimension or
    independent priority review is claimed.
  authors:
    - "John Tripodo"
  responsible_maintainers:
    - "John Tripodo"
  license: MIT
classification:
  arxiv: [math.CO, math.MG]
  msc2020: []
sources:
  - title: "Separated distances in fixed dimension"
    type: paper
    authors: ["John Tripodo"]
    relationship: formalizes
    url: "https://hexagonmath.org/2610.00254v2"
    note: "The dimension-29 theorem of this preprint, in the unbounded-subsequence form stated in Challenge.lean. The preprint's written all-n corollary is not formalized here."
  - title: "Formal Conjectures: Erdős Problem 670"
    type: other
    relationship: states
    url: "https://github.com/google-deepmind/formal-conjectures/blob/2f91d251c07fbbaf9435166d47c11e884a08a6cf/FormalConjectures/ErdosProblems/670.lean"
    note: "Source of the verbatim proposition and definition negated by Erdos670.not_erdos_670."
related_formalizations:
